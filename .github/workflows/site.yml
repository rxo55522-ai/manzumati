name: site

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROJECT: manzumati
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Security tests
        if: github.event_name == 'push'
        run: python -m unittest -v tests.test_security

      - name: Check systems
        id: check
        if: github.event_name != 'push'
        run: |
          cp data/status.json "$RUNNER_TEMP/old-status.json"
          python -m manzumati.checker --data data
          python tools/status_changed.py "$RUNNER_TEMP/old-status.json" data/status.json >> "$GITHUB_OUTPUT"

      - name: Save status
        if: steps.check.outputs.commit == 'true'
        run: |
          git config user.name "manzumati-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json
          git commit -m "Update systems status" || exit 0
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Build and deploy
        if: github.event_name == 'push' || steps.check.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p static/fonts
          bash tools/fetch_fonts.sh || echo "fonts skipped"
          python -m manzumati.build --flat --out site
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main || true
          npx --yes wrangler@4 pages deploy site --project-name "$PROJECT" --branch main --commit-dirty=true
