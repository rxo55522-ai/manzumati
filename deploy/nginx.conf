# /etc/nginx/sites-available/manzumati
# إعداد nginx لموقع منظومتي. غيّر manzumati.ly للدومين الحقيقي.
# الشهادة من Let's Encrypt:  sudo certbot certonly --webroot -w /var/www/certbot -d manzumati.ly -d www.manzumati.ly

# حد للطلبات: 10 طلبات في الثانية لكل عنوان IP (مع سماحية 40)، يخفف هجمات الإغراق البسيطة
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=connip:10m;

# أي طلب بدومين غريب (أو بعنوان IP مباشرة) يتقفل بدون رد
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    server_name _;
    return 444;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name manzumati.ly www.manzumati.ly;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://manzumati.ly$request_uri; }
}

# www → بدون www
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.manzumati.ly;
    ssl_certificate     /etc/letsencrypt/live/manzumati.ly/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manzumati.ly/privkey.pem;
    return 301 https://manzumati.ly$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name manzumati.ly;

    # ---- التشفير ----
    ssl_certificate     /etc/letsencrypt/live/manzumati.ly/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manzumati.ly/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    ssl_session_cache shared:SSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---- ما نكشفوش نسخة السيرفر ----
    server_tokens off;

    # ---- حدود الحجم والوقت (ضد الإغراق والطلبات البطيئة) ----
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
    large_client_header_buffers 4 8k;
    limit_req zone=perip burst=40 nodelay;
    limit_conn connip 30;
    limit_req_status 429;

    # ---- ترويسات الحماية ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    root /var/www/manzumati/current;
    index index.html;
    charset utf-8;
    disable_symlinks off;   # لازم، لأن current رابط للنسخة الحالية
    autoindex off;

    # بس GET و HEAD مسموحين. الموقع ما يستقبل أي بيانات.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # أي ملف مخفي (.git, .env, .checker.lock ...) ممنوع
    location ~ /\. { deny all; return 404; }
    location = /_headers { return 404; }   # ملف إعدادات Cloudflare Pages، مش للزوار
    # أي امتداد مش من ملفات الموقع ممنوع (نسخ احتياطية، سكربتات...)
    location ~* \.(py|pyc|json|sh|bak|old|orig|swp|sql|log|ini|conf|env|zip|tar|gz)$ { deny all; return 404; }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # الملفات الثابتة تتخزن عند الزائر (أسرع وأخف على السيرفر)
    location ~* \.(css|js|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        # nginx ما يورّثش add_header لما نضيف واحد جديد، فنعاودو الترويسات المهمة
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        try_files $uri =404;
    }

    error_page 404 /404.html;
    error_page 405 429 500 502 503 504 /404.html;
}
